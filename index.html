<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You 💖</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* TAP TO START */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    .overlay-text {
      background: white;
      padding: 20px 30px;
      border-radius: 30px;
      font-size: 18px;
      color: #e63946;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* SLIDE */
    .slide {
      background: rgba(255,255,255,0.95);
      width: 90%;
      max-width: 400px;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }

    .slide img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .caption {
      color: #444;
      font-size: 16px;
      line-height: 1.4;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #999;
    }

    /* BUTTONS */
    .buttons {
      position: relative;
      height: 120px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }

    .yes-btn {
      background: #e63946;
      color: white;
    }

    .no-btn {
      position: absolute;
      background: #aaa;
      color: white;
      left: 50%;
      top: 60px;
      transform: translateX(-50%);
    }

    /* HEARTS */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- START -->
  <div id="startOverlay">
    <div class="overlay-text">Tap to begin 💗</div>
  </div>

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- SLIDE -->
  <div class="slide" id="slide"></div>

  <script>
    const slideEl = document.getElementById("slide");
    const overlay = document.getElementById("startOverlay");
    const music = document.getElementById("bgMusic");

    let currentSlide = 0;
    let slideTimer = null;

    const SLIDE_DURATION = 20000; // 20 seconds

    const slides = [
      {
        img: "slide1.jpg",
        text: "Here’s our first date 💕"
      },
      {
        img: "slide2.jpg",
        text: "I was serious from the beginning — and I still am."
      },
      {
        img: "slide3.jpg",
        text: "All the random moments that just felt right with you"
      },
      {
        img: "slide4.jpg",
        text: "Even on busy days, you were my calm"
      },
      {
        img: "slide5.jpg",
        text: "And I still choose you — every time 💗"
      },
      {
        final: true
      }
    ];

    function renderSlide() {
      clearTimeout(slideTimer);
      const s = slides[currentSlide];

      if (s.final) {
        slideEl.innerHTML = `
          <h2 style="color:#e63946">
            Alliza Anne De Vera Almocera,<br>
            will you be my Valentine? 💖
          </h2>

          <p>
            I know the timing hasn’t been perfect,  
            but I don’t want that to stop me  
            from choosing you.
          </p>

          <p>
            This Sunday, I’d love to spend  
            the morning and afternoon with you —  
            just us.
          </p>

          <div class="buttons">
            <button class="yes-btn" onclick="sayYes(event)">Yes 💕</button>
            <button class="no-btn" id="noBtn">No 😅</button>
          </div>

          <div class="hint">You can try… but you can’t say no 😉</div>
        `;

        const noBtn = document.getElementById("noBtn");
        noBtn.addEventListener("mouseover", moveNo);
        noBtn.addEventListener("touchstart", moveNo);
        return;
      }

      slideEl.innerHTML = `
        <img src="${s.img}">
        <div class="caption">${s.text}</div>
        <div class="hint">Just wait 💗</div>
      `;

      slideTimer = setTimeout(nextSlide, SLIDE_DURATION);
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function sayYes(e) {
      e.stopPropagation();
      alert("It’s a date 💗");
    }

    function moveNo(e) {
      e.preventDefault();
      const btn = e.target;
      btn.style.left = Math.random() * 240 + "px";
      btn.style.top = Math.random() * 80 + "px";
    }

    overlay.addEventListener("click", () => {
      music.volume = 0.6;
      music.play();
      overlay.style.display = "none";
      renderSlide();
    });

    function createHeart() {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = "❤️";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = (3 + Math.random() * 5) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
